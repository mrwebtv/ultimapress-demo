# Builds the two images the trial server runs:
#   ghcr.io/mrwebtv/ultimapress-demo           the official UltimaPress with overlay/ applied
#   ghcr.io/mrwebtv/ultimapress-demo-launcher  the launcher
# Runs on every push here, every night (to pick up new UltimaPress versions), or by hand.
name: Build images

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the official UltimaPress code
        uses: actions/checkout@v4
        with:
          repository: mrwebtv/ultimapress
          ref: main
          path: core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Turn it into the demo
        run: node apply.mjs core

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Demo image
        uses: docker/build-push-action@v6
        with:
          context: core
          push: true
          tags: ghcr.io/mrwebtv/ultimapress-demo:latest
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo

      - name: Launcher image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: launcher/Dockerfile
          push: true
          tags: ghcr.io/mrwebtv/ultimapress-demo-launcher:latest
          cache-from: type=gha,scope=launcher
          cache-to: type=gha,mode=max,scope=launcher
