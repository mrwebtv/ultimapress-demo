# UltimaPress free trial server (tryultimapress.com).
# Needs .env next to this file (copy .env.example) and the Cloudflare Origin certificate in certs/.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: launcher
    command: ['postgres', '-c', 'max_connections=500', '-c', 'shared_buffers=512MB']
    volumes:
      - pg:/var/lib/postgresql/data
    networks: [demos]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d launcher']
      interval: 5s
      timeout: 5s
      retries: 20

  launcher:
    image: ghcr.io/mrwebtv/ultimapress-demo-launcher:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NETWORK: up-demos
      DATA_DIR: /data
    volumes:
      # The launcher starts and removes the demo containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - launcher:/data
    networks: [demos, edge]
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy:/data
    networks: [edge]
    depends_on: [launcher]

networks:
  demos:
    name: up-demos
  edge: {}

volumes:
  pg:
  launcher:
  caddy:
